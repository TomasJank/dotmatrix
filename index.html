<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dotmatrix</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>dotmatrix</h1>
      <p id="hint">Drop a Game Boy ROM (.gb) anywhere, or <label>choose a file<input type="file" id="rom" accept=".gb" hidden></label></p>
      <div id="error" hidden></div>
      <div class="bezel">
        <canvas id="screen" width="160" height="144"></canvas>
      </div>
      <table id="controls">
        <tr><td>Arrows</td><td>D-pad</td></tr>
        <tr><td>X</td><td>A</td></tr>
        <tr><td>Z</td><td>B</td></tr>
        <tr><td>Enter</td><td>Start</td></tr>
        <tr><td>Shift</td><td>Select</td></tr>
      </table>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
